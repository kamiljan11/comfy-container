name: Mutation Testing
# Mutation testing TYLKO na plikach zmienionych w PR (Stryker + vitest). Research 2026-09-06 (research-ai-slop.md,
# zrodla 21-23): coverage skacze 30->90 % w minuty bez realnej weryfikacji, a mutation survival w kodzie AI jest
# o 15-25 % wyzszy przy tym samym coverage. Ten job mierzy, czy testy ZABIJAJA mutanty w tym, co PR zmienil.
#
# Zasady:
# - liczy tylko zmienione pliki zrodlowe (src/**, supabase/functions/**; bez testow, typow, konfiguracji),
# - pomija sie sam (exit 0, informacja), gdy: brak vitest w package.json, brak PRAWDZIWYCH testow (tylko szablonowy
#   example.test.ts), brak zmienionych plikow zrodlowych — mutation testing bez testow niczego nie mierzy,
# - prog: mutation score < 50 % na zmienionych plikach = FAIL (thresholds.break); swiadome ominiecie = etykieta PR
#   "allow-low-mutation" (widoczna decyzja w UI, nie zmienna srodowiskowa),
# - job-level `if` NIE uzywa secrets/hashFiles (job-level if z nimi = caly plik niewazny — blizna floty),
# - akcje przypiete SHA (jak w quality.yml).
# - Stryker liczy na vitest@4.1.11 (pin tylko w tym jobie, patrz krok Install): runner 10.0.0 z Vitest 5 odpala
#   0 testow na mutanta i raportuje wszystko jako "Survived" (PR #38: 0 z 104 zabitych; stryker-js#6210),
# - straznik po Strykerze: mutant "Survived" z pokryciem (coveredBy), ale bez wykonanego testu (testsCompleted 0)
#   = runner nic nie sprawdzil -> FAIL zamiast cichego 0 %. Reprodukcja lokalna: docs/RUNBOOK.md, sekcja CI.

on:
  pull_request:
    # labeled/unlabeled: etykieta allow-low-mutation jest udokumentowana sciezka
    # ominiecia tej bramki, wiec jej zalozenie musi przeliczyc check (bez tego
    # czerwony wynik wisial na PR do nastepnego pusha — #13).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (zmienione pliki)
    # labeled/unlabeled lapia KAZDA etykiete (GitHub nie filtruje triggera po nazwie),
    # wiec bez drugiego warunku dowolna etykieta odpalalaby pelny run Strykera.
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'allow-low-mutation')
          && (github.event.action != 'labeled' && github.event.action != 'unlabeled'
              || github.event.label.name == 'allow-low-mutation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: 24

      - name: Zakres — zmienione pliki zrodlowe i realne testy
        id: scope
        if: hashFiles('package.json') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! grep -q '"vitest"' package.json; then echo "skip=brak vitest w package.json" >> "$GITHUB_OUTPUT"; exit 0; fi
          # `grep -v` zwraca 1, gdy nic nie przepusci (np. jedyny test to szablonowy example.test.ts) — przy pipefail
          # cala linia padala z exit 1 zamiast "skip" (rollout 2026-09-06, 6 z 13 repo). Stad `|| true` w grupie.
          real_tests=$(git ls-files 'src/**/*.test.*' 'src/**/*.spec.*' 'supabase/functions/**/*.test.*' | { grep -v -E '(^|/)example\.test\.' || true; } | wc -l)
          if [ "$real_tests" -eq 0 ]; then echo "skip=brak prawdziwych testow (tylko szablon) — mutation testing niczego nie zmierzy; napisz testy, a bramka zacznie dzialac" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin "$BASE_REF"
          changed=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- 'src/**/*.ts' 'src/**/*.tsx' 'supabase/functions/**/*.ts' \
            | grep -v -E '\.(test|spec)\.|\.d\.ts$|(^|/)(types?|__tests__|test)/|vite-env' || true)
          if [ -z "$changed" ]; then echo "skip=brak zmienionych plikow zrodlowych" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Pliki bez logiki (tresc strony, dane) — jawna lista z powodem w .github/mutation-exclude.txt. Bez niej PR
          # zmieniajacy tylko tekst strony konczyl sie "Stryker nie zapisal raportu" (dry run: 0 testow), a czerwony
          # wynik ignorowano (PR #37, #49, #69). Dopasowanie po DOKLADNEJ sciezce, kazde pominiecie widac jako notice.
          EXCL=.github/mutation-exclude.txt
          if [ -f "$EXCL" ]; then
            kept=""
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # `sub(/\r$/...)`: plik zapisany z CRLF (Windows) nie moze po cichu wylaczyc dopasowania (claude-review #70).
              reason=$(awk -v f="$f" '{ sub(/\r$/, "") } $1 == f && /#[[:space:]]*[^[:space:]]/ { sub(/^[^#]*#[[:space:]]*/, ""); print; exit }' "$EXCL")
              if [ -n "$reason" ]; then echo "::notice::Mutation pomija $f (mutation-exclude.txt): $reason"; else kept="$kept$f"$'\n'; fi
            done <<< "$changed"
            changed=$(printf '%s' "$kept" | sed '/^$/d')
          fi
          if [ -z "$changed" ]; then echo "skip=zmienione pliki sa tylko na liscie .github/mutation-exclude.txt (tresc bez logiki)" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "files=$(echo "$changed" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "Zmienione pliki zrodlowe:"; echo "$changed"

      - name: Pominiete
        if: steps.scope.outputs.skip != ''
        env:
          WHY: ${{ steps.scope.outputs.skip }}
        run: echo "::notice::Mutation testing pominiete — $WHY"

      - name: Install
        if: steps.scope.outputs.files != ''
        run: |
          npm ci || npm install
          # Stryker i runner musza siedziec w node_modules PROJEKTU: core laduje plugin
          # runnera oraz `typescript` (ts-config-preprocessor) zwykla rezolucja Node od
          # swojego pliku, wiec odpalony z cache npx (-p) nie widzial ani jednego, ani
          # drugiego (PR #13: "Cannot find plugin", "Cannot find package 'typescript'").
          # vitest@4.1.11 TYLKO na czas tego joba (package.json zostaje na Vitest 5): Vitest 5 dopasowuje
          # testNamePattern do nazwy "describe > it" (createTaskName, separator " > "), a vitest-runner 10.0.0
          # (najnowszy) filtruje testy mutanta wzorcem "describe it" (spacja). Wzorzec nie lapie niczego, kazdy
          # mutant przechodzi po 0 testach -> "Survived" (PR #38: 0/24 i 0/80). Upstream: stryker-js#6210, fix w PR
          # #6214; zadna kombinacja coverageAnalysis x vitest.related tego nie obchodzi. Zdejmij pin, gdy wyjdzie
          # runner z fixem i reprodukcja z docs/RUNBOOK.md zabije mutanty na Vitest 5 (straznik nizej to sprawdzi).
          # Ten sam wiersz `npm install` stoi w docs/RUNBOOK.md (reprodukcja) — zmieniaj oba naraz.
          npm install --no-save --no-audit --no-fund @stryker-mutator/core@10.0.0 @stryker-mutator/vitest-runner@10.0.0 vitest@4.1.11
          node -e 'const fs = require("fs"); const ver = (p) => JSON.parse(fs.readFileSync("node_modules/" + p + "/package.json", "utf8")).version; const v = ver("vitest"), r = ver("@stryker-mutator/vitest-runner"); console.log("vitest " + v + ", vitest-runner " + r); if (v !== "4.1.11" || r !== "10.0.0") process.exit(1)'

      - name: Stryker na zmienionych plikach (prog 50 %)
        if: steps.scope.outputs.files != ''
        env:
          FILES: ${{ steps.scope.outputs.files }}
        run: |
          set -euo pipefail
          node -e '
            const files = process.env.FILES.split(",").filter(Boolean);
            const cfg = {
              $schema: "https://raw.githubusercontent.com/stryker-mutator/stryker-js/master/packages/core/schema/stryker-schema.json",
              testRunner: "vitest",
              mutate: files,
              reporters: ["clear-text", "progress", "json"],
              thresholds: { high: 80, low: 60, break: 50 },
              timeoutMS: 20000,
              concurrency: 2,
              tempDirName: ".stryker-tmp",
              ignoreStatic: true
            };
            require("fs").writeFileSync("stryker.pr.config.json", JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg, null, 2));
          '
          rc=0
          npx stryker run stryker.pr.config.json 2>&1 | tee stryker.log || rc=$?
          # Straznik: "Survived" jest dowodem tylko wtedy, gdy testy naprawde sie wykonaly. Mutant pokryty testami
          # (coveredBy), a z testsCompleted 0 albo bez tego pola (w schemacie jest opcjonalne) = runner nie odpalil zadnego testu -> wynik niewazny, FAIL.
          REPORT=reports/mutation/mutation.json
          if [ ! -f "$REPORT" ]; then
            # Dry run bez testow = zaden test nie importuje zmienionego pliku (vitest-runner uruchamia testy powiazane).
            # To realna luka (logika bez testu), nie awaria narzedzia — komunikat mowi, co zrobic.
            if grep -q "No tests were executed" stryker.log; then
              echo "::error::Zmienione pliki nie maja ZADNEGO testu, ktory je importuje (Stryker dry run: No tests were found): $FILES. Dopisz test. Plik bez logiki (tresc, dane) dodaj do .github/mutation-exclude.txt z powodem."
            else
              echo "::error::Stryker nie zapisal $REPORT (exit $rc) — log wyzej"
            fi
            exit 1
          fi
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const unrun = Object.entries(report.files).flatMap(([file, { mutants }]) => mutants
              .filter((m) => m.status === "Survived" && (m.coveredBy ?? []).length > 0 && (m.testsCompleted ?? 0) === 0)
              .map((m) => `${file}:${m.location.start.line} ${m.mutatorName}`));
            if (unrun.length > 0) {
              console.log(`::error::${unrun.length} mutant(ow) "Survived" bez ani jednego wykonanego testu, choc testy je pokrywaja: runner nie odpalil testow, wynik jest niewazny. Sprawdz vitest vs @stryker-mutator/vitest-runner (stryker-js#6210).`);
              unrun.slice(0, 20).forEach((u) => console.log("  " + u));
              process.exit(1);
            }
            console.log("Straznik: kazdy przezywajacy mutant mial wykonane testy.");
          ' "$REPORT"
          exit "$rc"
